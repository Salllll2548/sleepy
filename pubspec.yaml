name: sleepy
description: Drowsiness detection app connected to car Bluetooth
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  simple_pip_mode: ^1.0.0 # แพ็กเกจช่วยสลับหน้าจอ PiP
  # กล้อง
  camera: ^0.10.6

  # แจ้งเตือน
  flutter_local_notifications: ^17.2.3

  # เสียงเตือน + สั่น
  audioplayers: ^6.0.0

  # ขอ permission (กล้อง/บลูทูธ/แจ้งเตือน)
  permission_handler: ^11.3.1

  # เก็บค่า config (เช่น MAC address รถที่จับคู่ไว้, threshold)
  shared_preferences: ^2.2.3

  # กราฟแท่งสถิติรายวัน (หน้าสถิติการขับขี่)
  fl_chart: ^0.68.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0

  ultralytics_yolo: ^0.6.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/favicon.png" # พาธที่เก็บรูปของคุณ
  min_sdk_android: 21

  adaptive_icon_background: "#121A21" # ใส่รหัสสีพื้นหลังแอปของคุณ (เช่น สีธีมมืด)
  adaptive_icon_foreground: "assets/favicon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/hrk.mp3
    - assets/models/best.tflite
